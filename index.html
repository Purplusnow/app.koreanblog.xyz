<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purplusnow — Apps</title>
<meta name="description" content="Indie mobile apps by Purplusnow — privacy-first, offline-friendly. Available on Google Play.">
<meta property="og:title" content="Purplusnow — Apps">
<meta property="og:description" content="Indie mobile apps by Purplusnow — privacy-first, offline-friendly. Available on Google Play.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/img/apps/pocketarcade.png">
<meta name="theme-color" content="#0b0b12">
<link rel="icon" type="image/png" href="assets/img/apps/facelapse.png">

<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./" aria-label="Purplusnow">
      <span class="brand-dot"></span>
      <span class="brand-name">Purplusnow</span>
    </a>
    <div class="header-tools">

        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 16a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4.2 4.2a1 1 0 011.4 0l1.5 1.5A1 1 0 115.7 7.1L4.2 5.6a1 1 0 010-1.4zm12.6 12.6a1 1 0 011.4 0l1.5 1.5a1 1 0 01-1.4 1.4l-1.5-1.5a1 1 0 010-1.4zM2 12a1 1 0 011-1h2a1 1 0 110 2H3a1 1 0 01-1-1zm16 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM5.6 19.8l1.5-1.5a1 1 0 10-1.4-1.4L4.2 18.4a1 1 0 101.4 1.4zM19.8 5.6l-1.5 1.5a1 1 0 11-1.4-1.4l1.5-1.5a1 1 0 111.4 1.4z"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z"/></svg>
      </button>
      <div class="lang-picker">
        <button id="langBtn" class="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-3a15 15 0 00-1.2-3.6A8 8 0 0118.9 8zM12 4c.8 1.1 1.4 2.5 1.8 4h-3.6C10.6 6.5 11.2 5.1 12 4zM4.3 14a8 8 0 010-4h3.4a17 17 0 000 4H4.3zm.8 2h3a15 15 0 001.2 3.6A8 8 0 015.1 16zm3-8h-3a8 8 0 013.2-3.6A15 15 0 007.1 8zM12 20c-.8-1.1-1.4-2.5-1.8-4h3.6c-.4 1.5-1 2.9-1.8 4zm2.2-6H9.8a15 15 0 010-4h4.4a15 15 0 010 4zm.7 5.6a15 15 0 001.2-3.6h3a8 8 0 01-4.2 3.6zM16.3 14a17 17 0 000-4h3.4a8 8 0 010 4h-3.4z"/></svg>
          <span id="langLabel">English</span>
        </button>
        <ul id="langMenu" class="lang-menu" role="listbox" hidden></ul>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <p class="hero-kicker" data-i="hero_kicker"></p>
      <h1 class="hero-title" data-i="hero_title"></h1>
      <p class="hero-sub" data-i="hero_sub"></p>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
  </section>

  <section class="apps-section wrap">
    <h2 class="section-title" data-i="section_live"></h2>
    <div id="liveGrid" class="app-grid"></div>
  </section>

  <section id="soonSection" class="apps-section wrap" hidden>
    <h2 class="section-title" data-i="section_soon"></h2>
    <div id="soonGrid" class="app-grid"></div>
  </section>

  <section class="cta-row wrap">
    <a id="viewAll" class="btn btn-ghost" href="#" target="_blank" rel="noopener"></a>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="brand"><span class="brand-dot"></span><span class="brand-name">Purplusnow</span></span>
    <span class="footer-note" data-i="footer_note"></span>
    <span class="footer-rights" data-i="footer_rights"></span>
  </div>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
